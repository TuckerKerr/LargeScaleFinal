<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Fan Fest</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: #182337;
      background: #f5f7fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    header {
      background: #172b50;
      color: #fff;
      padding: 30px max(24px, calc((100vw - 1050px)/2));
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 2rem;
    }

    header p {
      margin: 0;
      opacity: .85;
    }

    main {
      max-width: 1050px;
      margin: 32px auto;
      padding: 0 24px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      margin-bottom: 20px;
    }

    .identity {
      display: flex;
      flex-direction: column;
      gap: 5px;
      flex: 1;
      min-width: 230px;
    }

    label {
      font-size: .9rem;
      font-weight: 650;
    }

    input {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 11px 12px;
      font: inherit;
      background: white;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #90b4ff;
      outline-offset: 2px;
    }

    #events {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(275px, 1fr));
      gap: 18px;
    }

    .event {
      background: white;
      border: 1px solid #e2e7f0;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 5px 18px #192c4d0b;
    }

    .event h2 {
      font-size: 1.15rem;
      line-height: 1.35;
      margin: 0 0 10px;
    }

    .campus {
      color: #62718a;
      font-size: .9rem;
      margin-bottom: 24px;
    }

    .counts {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      margin-bottom: 9px;
    }

    .counts strong {
      font-weight: 700;
    }

    .track {
      width: 100%;
      height: 12px;
      background: #e8edf5;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 21px;
    }

    .fill {
      height: 100%;
      width: 0;
      background: #386bd6;
      border-radius: inherit;
      transition: width .3s ease;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px;
      background: #2859c7;
      color: white;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .event button {
      width: 100%;
    }

    button:hover:not(:disabled) {
      background: #1c469f;
    }

    button:disabled {
      background: #a7b1c3;
      cursor: not-allowed;
    }

    .notice {
      min-height: 22px;
      font-size: .85rem;
      margin-top: 12px;
      color: #475569;
      overflow-wrap: anywhere;
    }

    .notice.error {
      color: #a02020;
    }

    .notice.success {
      color: #17613e;
    }

    #page-status {
      margin: 0 0 18px;
      color: #62718a;
    }
  </style>
</head>

<body>
  <header>
    <h1>Campus Fan Fest</h1>
    <p>Explore events and reserve your seat.</p>
  </header>
  <main>
    <div class="toolbar">
      <div class="identity">
        <label for="username">Student name</label>
        <input id="username" type="text" maxlength="255" autocomplete="name" placeholder="Enter your registered name" />
      </div>
      <button id="refresh" type="button">Refresh events</button>
    </div>
    <p id="page-status" role="status">Loading events…</p>
    <section id="events" aria-label="Campus events"></section>
  </main>
  <script>
    // Set API_BASE to your Flask server origin when serving this HTML separately.
    // Example: 'http://localhost:5000'. Leave empty if frontend and API share an origin.
    const API_BASE = 'http://127.0.0.1:5000';
    // Expected GET /api/events: [{"id":1,"name":"...","campus":"North Campus","capacity":49,"reserved":12}]
    // POST /api/reservations: {"username":"Avery Brooks","eventId":1}
    // Expected 202 response: {"status":"pending","requestId":"..."}
    // Optional GET /api/reservations/<requestId> status polling is NOT assumed to exist.

    const eventsElement = document.getElementById('events');
    const pageStatus = document.getElementById('page-status');
    const usernameInput = document.getElementById('username');
    const refreshButton = document.getElementById('refresh');
    const pendingRequests = new Map(); // event ID -> Redis request ID (this page only)

    function createEventCard(event) {
      // Supports either frontend-style keys or your SQL column names.
      const id = event.id ?? event.event_id;
      const capacity = Math.max(0, Number(event.capacity) || 0);
      const reserved = Math.max(0, Number(event.reserved ?? event.registered_count) || 0);
      const full = reserved >= capacity;
      const percent = capacity ? Math.min(100, (reserved / capacity) * 100) : 0;
      const card = document.createElement('article');
      card.className = 'event';

      const title = document.createElement('h2');
      title.textContent = event.name ?? event.event_name ?? 'Untitled event';
      const campus = document.createElement('div');
      campus.className = 'campus';
      campus.textContent = event.campus ?? '';
      const counts = document.createElement('div');
      counts.className = 'counts';
      const going = document.createElement('strong');
      going.textContent = `${reserved} going`;
      const total = document.createElement('span');
      total.textContent = `${capacity} seats`;
      counts.append(going, total);

      const track = document.createElement('div');
      track.className = 'track';
      track.setAttribute('role', 'progressbar');
      track.setAttribute('aria-label', 'Seats reserved');
      track.setAttribute('aria-valuemin', '0');
      track.setAttribute('aria-valuemax', String(capacity));
      track.setAttribute('aria-valuenow', String(Math.min(reserved, capacity)));
      const fill = document.createElement('div');
      fill.className = 'fill';
      fill.style.width = `${percent}%`;
      track.append(fill);

      const button = document.createElement('button');
      button.type = 'button';
      const pending = pendingRequests.has(String(id));
      button.textContent = full ? 'Event Full' : pending ? 'Request Pending' : 'Register';
      button.disabled = full || pending || id == null;
      const notice = document.createElement('div');
      notice.className = 'notice';
      notice.setAttribute('role', 'status');
      if (pending) notice.textContent = 'Request queued. Awaiting processing; refresh to see updated attendance.';

      button.addEventListener('click', async () => {
        const username = usernameInput.value.trim();
        if (!username) {
          notice.className = 'notice error';
          notice.textContent = 'Enter your student name before registering.';
          usernameInput.focus();
          return;
        }
        button.disabled = true;
        button.textContent = 'Submitting…';
        notice.className = 'notice';
        notice.textContent = '';
        try {
          const response = await fetch(`${API_BASE}/api/reservations`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, eventId: id })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.message || result.error || `HTTP ${response.status}`);
          if (result.status === 'confirmed') {
            notice.className = 'notice success';
            notice.textContent = 'Registration confirmed.';
            await loadEvents();
          } else {
            pendingRequests.set(String(id), result.requestId ?? 'queued');
            button.textContent = 'Request Pending';
            notice.textContent = 'Request queued. This is not a confirmed seat yet.';
          }
        } catch (error) {
          notice.className = 'notice error';
          notice.textContent = error.message || 'Could not submit request.';
          button.disabled = false;
          button.textContent = 'Register';
        }
      });

      card.append(title, campus, counts, track, button, notice);
      return card;
    }

    async function loadEvents() {
      refreshButton.disabled = true;
      try {
        const response = await fetch(`${API_BASE}/api/events`, { credentials: 'include' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        const events = Array.isArray(data) ? data : data.events;
        if (!Array.isArray(events)) throw new Error('Expected an events array');
        eventsElement.replaceChildren(...events.map(createEventCard));
        pageStatus.textContent = events.length ? '' : 'No events available.';
      } catch (error) {
        pageStatus.textContent = `Unable to load events: ${error.message}`;
      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener('click', loadEvents);
    loadEvents();
  </script>
</body>

</html>
